    <!-- SVG Filters for hand-drawn effects -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
      <defs>
        <!-- Sketchy/rough edge filter -->
        <filter id="sketchy-filter" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Wobbly/wavy filter -->
        <filter id="wobble-filter" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turbulence" />
          <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <!--
      This is the ONLY HTML in our entire app!
      React will inject all our components into this div.
      That's what makes it a "Single Page Application" (SPA).
    -->
    <div id="root"></div>

    <!--
      This script loads our React app.
      Vite handles all the compilation - we just point to our entry file.
    -->

    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
